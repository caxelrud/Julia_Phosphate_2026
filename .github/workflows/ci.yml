name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Julia ${{ matrix.version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  reports:
    name: Generate the reports and the PDFs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1

      # the runners ship Chrome, so the printouts can be turned into PDFs here too
      - name: Static notebook checks
        run: julia --project=. scripts/validate_notebooks.jl

      - name: Generate data, printouts and PDFs
        run: julia --project=. scripts/generate_reports.jl --seed=20260101 --days=365

      - name: Run the notebooks headless
        run: julia --project=. scripts/run_notebooks.jl --no-pdf

      - name: Upload the reports
        uses: actions/upload-artifact@v4
        with:
          name: phosphate-reports
          path: |
            reports/html/*.html
            reports/pdf/*.pdf
            data/*.json
            data/*.csv
            data/*.wav
